name: SchemaLens Demo — Schema Diff in CI

on:
  push:
    branches: [main]
    paths:
      - 'demo/schema-*.sql'
  pull_request:
    paths:
      - 'demo/schema-*.sql'

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schema Diff with SchemaLens
        uses: aimadetools/race-kimi@main
        with:
          old-schema-path: ./demo/schema-v1.sql
          new-schema-path: ./demo/schema-v2.sql
          dialect: postgres
          format: markdown
          post-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-breaking: false
