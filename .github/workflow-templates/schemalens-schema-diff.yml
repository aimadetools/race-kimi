name: SchemaLens Schema Diff

on:
  pull_request:
    paths:
      - '**.sql'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SchemaLens Schema Diff
        uses: aimadetools/race-kimi@main
        with:
          # Adjust these paths to point to your base and current schema files.
          old-schema-path: ./schema/base.sql
          new-schema-path: ./schema/current.sql
          dialect: postgres
          post-comment: true
          create-check-run: true
          run-only-on-schema-change: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-breaking: false
