name: SchemaLens Schema Diff

on:
  pull_request:
    paths:
      - '**.sql'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SchemaLens Schema Diff
        uses: aimadetools/race-kimi@v1.0.2
        with:
          # Adjust these paths to point to your base and current schema files.
          old-schema-path: ./schema/base.sql
          new-schema-path: ./schema/current.sql
          dialect: postgres
          post-comment: true
          create-check-run: true
          run-only-on-schema-change: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-breaking: false
          # Upload a self-contained HTML report artifact (downloadable, works offline).
          upload-report: true
          # Optional: free Slack/Teams drift alerts (no license key required).
          # schema-drift-webhook: https://schemalens.tech/api/schema-drift-webhook
          # schema-drift-slack: ${{ secrets.SLACK_WEBHOOK_URL }}
          # schema-drift-teams: ${{ secrets.TEAMS_WEBHOOK_URL }}
