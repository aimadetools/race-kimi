name: 'SchemaLens Schema Diff'
branding:
  icon: 'shield'
  color: 'indigo'
description: 'Catch breaking database schema changes in every pull request. Free schema diff for GitHub Actions with full migration SQL, PR comments, Check Runs, and risk scores. Add in one click from the Actions → New workflow tab using the built-in starter workflow. Upgrade to SchemaLens Team for drift alerts and shared workspaces. Supports PostgreSQL, MySQL, SQLite, SQL Server, and Oracle.'
inputs:
  old-schema-path:
    description: 'Path to the old schema SQL file'
    required: true
  new-schema-path:
    description: 'Path to the new schema SQL file'
    required: true
  dialect:
    description: 'SQL dialect: postgres | mysql | sqlite | mssql | oracle'
    default: 'postgres'
    required: false
  license-key:
    description: 'SchemaLens Pro or Team license key for schema drift alerts and advanced integrations. The GitHub Action diff is free and returns full migration SQL without a key.'
    required: false
  format:
    description: 'Output format: json | markdown'
    default: 'markdown'
    required: false
  fail-on-breaking:
    description: 'Fail the workflow if breaking changes are detected (true/false)'
    default: 'false'
    required: false
  post-comment:
    description: 'Post the diff as a PR comment (true/false). Requires GITHUB_TOKEN.'
    default: 'false'
    required: false
  create-check-run:
    description: 'Create a GitHub Check Run with the diff result (true/false). Requires GITHUB_TOKEN with checks:write.'
    default: 'false'
    required: false
  run-only-on-schema-change:
    description: 'Skip the diff if no .sql files were modified in this PR (true/false). Only applies to pull_request events.'
    default: 'false'
    required: false
  github-token:
    description: 'GitHub token for posting PR comments, creating check runs, and checking changed files'
    required: false
  schema-drift-webhook:
    description: 'Send the diff result to the SchemaLens hosted schema drift webhook (https://schemalens.tech/api/schema-drift-webhook) to generate shareable alert pages and Slack/Teams notifications. Free tier works without a license key; provide a SchemaLens Team license key for persistent alert history and higher rate limits.'
    required: false
  schema-drift-slack:
    description: 'Slack Incoming Webhook URL for schema drift alerts. Requires schema-drift-webhook to be set.'
    required: false
  schema-drift-teams:
    description: 'Microsoft Teams Webhook URL for schema drift alerts. Requires schema-drift-webhook to be set.'
    required: false
  upload-report:
    description: 'Upload a self-contained HTML schema diff report as a GitHub Actions artifact (true/false). The artifact includes summary, risk score, breaking changes, migration SQL, rollback SQL, and SchemaLens CTAs.'
    default: 'false'
    required: false
  report-title:
    description: 'Optional title for the uploaded report artifact.'
    default: 'SchemaLens Schema Diff Report'
    required: false
outputs:
  report-url:
    description: 'URL to the uploaded HTML report artifact (only set when upload-report is true).'
    value: ${{ steps.export-report.outputs.report-url }}
runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required but not installed. Add a step that installs jq, e.g.:"
          echo "  - run: sudo apt-get install -y jq"
          exit 1
        fi
        case "${{ inputs.dialect }}" in
          postgres|mysql|sqlite|mssql|oracle) ;;
          *) echo "::error::Invalid dialect '${{ inputs.dialect }}'. Must be one of: postgres, mysql, sqlite, mssql, oracle"; exit 1 ;;
        esac

    - name: Check for schema file changes
      id: changed
      if: inputs.run-only-on-schema-change == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.sha }}"
        if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '\.sql$'; then
          echo "sql_changed=true" >> "$GITHUB_OUTPUT"
          echo "Schema files changed in this PR — will run diff."
        else
          echo "sql_changed=false" >> "$GITHUB_OUTPUT"
          echo "No schema files changed in this PR — skipping diff."
        fi

    - name: Skip diff (no schema changes)
      if: inputs.run-only-on-schema-change == 'true' && github.event_name == 'pull_request' && steps.changed.outputs.sql_changed == 'false'
      shell: bash
      run: |
        echo "No .sql files changed in this PR. Schema diff skipped."
        {
          echo "## ✅ SchemaLens Schema Diff"
          echo ""
          echo "No \`.sql\` files were modified in this pull request, so the schema diff was skipped to save CI time."
          echo ""
          echo "If you expected a diff, ensure your schema files have the \`.sql\` extension or set \`run-only-on-schema-change: false\`."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Validate schema paths
      shell: bash
      run: |
        if [ ! -r "${{ inputs.old-schema-path }}" ]; then
          echo "::error::old-schema-path '${{ inputs.old-schema-path }}' does not exist or is not readable"
          exit 1
        fi
        if [ ! -r "${{ inputs.new-schema-path }}" ]; then
          echo "::error::new-schema-path '${{ inputs.new-schema-path }}' does not exist or is not readable"
          exit 1
        fi

    - name: Diff schemas with SchemaLens
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        DIALECT="${{ inputs.dialect }}"
        FORMAT="${{ inputs.format }}"
        LICENSE_KEY="${{ inputs.license-key }}"
        OLD_PATH="${{ inputs.old-schema-path }}"
        NEW_PATH="${{ inputs.new-schema-path }}"

        # Determine endpoint
        if [ -n "$LICENSE_KEY" ]; then
          ENDPOINT="https://schemalens.tech/api/diff"
          echo "Using Pro endpoint (license key provided)"
        else
          ENDPOINT="https://schemalens.tech/api/free-diff"
          echo "Using free endpoint (no license key)"
        fi

        # Build request
        BODY=$(jq -n \
          --arg schemaA "$(cat "$OLD_PATH")" \
          --arg schemaB "$(cat "$NEW_PATH")" \
          --arg dialect "$DIALECT" \
          --arg format "$FORMAT" \
          '{schemaA: $schemaA, schemaB: $schemaB, dialect: $dialect, format: $format}')

        # Call API with retries
        HTTP_STATUS=0
        for attempt in 1 2 3; do
          HTTP_STATUS=$(curl -s -o /tmp/schemalens_response.json -w "%{http_code}" -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            ${LICENSE_KEY:+-H "X-License-Key: $LICENSE_KEY"} \
            -d "$BODY" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            break
          fi
          echo "SchemaLens API attempt $attempt failed with HTTP $HTTP_STATUS. Retrying..."
          sleep "$((attempt * 2))"
        done

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "::error::SchemaLens API failed after 3 attempts (last HTTP status: $HTTP_STATUS)"
          if [ -r /tmp/schemalens_response.json ]; then
            echo "Response body:"
            cat /tmp/schemalens_response.json || true
          fi
          exit 1
        fi

        RESPONSE=$(cat /tmp/schemalens_response.json)

        # Validate JSON
        if ! echo "$RESPONSE" | jq -e '.' >/dev/null 2>&1; then
          echo "::error::SchemaLens API returned invalid JSON"
          echo "$RESPONSE"
          exit 1
        fi

        # Check for API-level errors
        if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error')
          echo "::error::SchemaLens API error: $ERROR_MSG"
          exit 1
        fi

        # Store output using multiline delimiter (safe for JSON with newlines)
        {
          echo "response<<SCHEMALENS_EOF"
          echo "$RESPONSE"
          echo "SCHEMALENS_EOF"
        } >> "$GITHUB_OUTPUT"

        # Extract breaking change count
        BCOUNT=$(echo "$RESPONSE" | jq -r '(.summary.breakingChangeCount // (.breakingChanges | length) // 0)')
        echo "breaking_count=${BCOUNT}" >> "$GITHUB_OUTPUT"

        # Extract summary fields for step summary
        RISK=$(echo "$RESPONSE" | jq -r '.riskScore.label // "Unknown"')
        SCORE=$(echo "$RESPONSE" | jq -r '.riskScore.score // 0')
        TA=$(echo "$RESPONSE" | jq -r '.summary.tablesAdded // 0')
        TR=$(echo "$RESPONSE" | jq -r '.summary.tablesRemoved // 0')
        TM=$(echo "$RESPONSE" | jq -r '.summary.tablesModified // 0')
        HAS_MIGRATION=$(echo "$RESPONSE" | jq -e '.migration' >/dev/null 2>&1 && echo "true" || echo "false")
        HAS_MARKDOWN=$(echo "$RESPONSE" | jq -e '.markdown' >/dev/null 2>&1 && echo "true" || echo "false")
        HAS_TEASER=$(echo "$RESPONSE" | jq -e '.migrationTeaser' >/dev/null 2>&1 && echo "true" || echo "false")
        TOTAL_LINES=$(echo "$RESPONSE" | jq -r '.totalMigrationLines // 0')

        # Build Job Summary markdown
        {
          echo "## 🔍 SchemaLens Schema Diff Report"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| 🟢 Tables Added | ${TA} |"
          echo "| 🔴 Tables Removed | ${TR} |"
          echo "| 🟡 Tables Modified | ${TM} |"
          echo "| ⚠️ Breaking Changes | ${BCOUNT} |"
          echo "| 📊 Risk Score | ${SCORE}/100 (${RISK}) |"
          echo ""

          if [ "$HAS_MIGRATION" = "true" ]; then
            MIGRATION=$(echo "$RESPONSE" | jq -r '.migration')
            echo "### Generated Migration"
            echo '```sql'
            echo "$MIGRATION"
            echo '```'
            echo ""
          elif [ "$HAS_MARKDOWN" = "true" ]; then
            MARKDOWN=$(echo "$RESPONSE" | jq -r '.markdown')
            echo "### Diff Summary"
            echo "$MARKDOWN"
            echo ""
          fi

          echo "---"
          echo ""
          echo "🔔 **Free schema drift alerts** — Get Slack/Teams notifications + shareable alert pages on every diff. [Add alerts in 30 seconds →](https://schemalens.tech/github-action.html#-schema-drift-alerts)"
          echo ""
          echo "💡 **Want a shared workspace with 90-day persisted alert history?** [Upgrade to SchemaLens Team](https://schemalens.tech/team-buy.html)."
          echo ""
          echo "*Generated by [SchemaLens GitHub Action](https://schemalens.tech/github-action.html)*"
        } >> "$GITHUB_STEP_SUMMARY"

        # Print formatted output to logs
        echo ""
        echo "=== SchemaLens Diff Result ==="
        if [ "$HAS_MARKDOWN" = "true" ]; then
          echo "$RESPONSE" | jq -r '.markdown'
        elif [ "$HAS_MIGRATION" = "true" ]; then
          echo "$RESPONSE" | jq -r '.migration'
        fi
        echo "================================"
        echo "Breaking changes detected: ${BCOUNT}"

    - name: Generate schema diff report
      id: report
      if: inputs.upload-report == 'true'
      shell: bash
      env:
        RESPONSE_JSON: ${{ steps.diff.outputs.response }}
      run: |
        set -euo pipefail
        RESPONSE="$RESPONSE_JSON"

        # Build metadata object
        REPO="${{ github.repository }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT="${{ github.sha }}"
        PR_URL="${{ github.event.pull_request.html_url || '' }}"
        RUN_ID="${{ github.run_id }}"

        METADATA=$(jq -n \
          --arg repo "$REPO" \
          --arg branch "$BRANCH" \
          --arg commit "$COMMIT" \
          --arg prUrl "$PR_URL" \
          --arg ciProvider "github-actions" \
          --arg runId "$RUN_ID" \
          --arg dialect "${{ inputs.dialect }}" \
          '{
            repo: $repo,
            branch: $branch,
            commit: $commit,
            prUrl: $prUrl,
            ciProvider: $ciProvider,
            runId: $runId,
            dialect: $dialect
          }')

        PAYLOAD=$(jq -n \
          --argjson response "$RESPONSE" \
          --argjson metadata "$METADATA" \
          '{response: $response, metadata: $metadata}')

        HTTP_STATUS=$(curl -s -o /tmp/schemalens_report.html -w "%{http_code}" -X POST "https://schemalens.tech/api/schema-diff-report" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" || echo "000")

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "::warning::Failed to generate schema diff report (HTTP $HTTP_STATUS)."
          exit 0
        fi

        REPORT_SIZE=$(stat -c%s /tmp/schemalens_report.html 2>/dev/null || stat -f%z /tmp/schemalens_report.html 2>/dev/null || echo "0")
        echo "Schema diff report generated (${REPORT_SIZE} bytes)."

    - name: Upload schema diff report
      id: upload-report
      if: inputs.upload-report == 'true' && steps.report.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-title }}
        path: /tmp/schemalens_report.html
        retention-days: 30

    - name: Export report URL
      id: export-report
      if: inputs.upload-report == 'true' && steps.upload-report.outcome == 'success'
      shell: bash
      run: |
        REPORT_URL="${{ steps.upload-report.outputs.artifact-url }}"
        if [ -n "$REPORT_URL" ]; then
          echo "report_url=${REPORT_URL}" >> "$GITHUB_OUTPUT"
          echo "report-url=${REPORT_URL}" >> "$GITHUB_OUTPUT"
          echo "Schema diff report artifact: ${REPORT_URL}"
        fi

    - name: Add report link to job summary
      if: inputs.upload-report == 'true' && steps.export-report.outputs.report-url != ''
      shell: bash
      run: |
        {
          echo ""
          echo "---"
          echo ""
          echo "📄 **Self-contained HTML report uploaded:** ${{ steps.export-report.outputs.report-url }}"
          echo ""
          echo "Download the artifact and open ".html" in any browser — no internet required."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on breaking changes
      if: inputs.fail-on-breaking == 'true' && steps.diff.outputs.breaking_count != '0'
      shell: bash
      run: |
        echo "::error::Breaking changes detected: ${{ steps.diff.outputs.breaking_count }}"
        exit 1

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESPONSE_JSON: ${{ steps.diff.outputs.response }}
        REPORT_URL: ${{ steps.export-report.outputs.report-url }}
      run: |
        RESPONSE="$RESPONSE_JSON"

        if echo "$RESPONSE" | jq -e '.markdown' >/dev/null 2>&1; then
          BODY=$(echo "$RESPONSE" | jq -r '.markdown')
        elif echo "$RESPONSE" | jq -e '.migration' >/dev/null 2>&1; then
          BODY=$(echo "$RESPONSE" | jq -r '.migration')
          BODY="## Schema Diff Report

\`\`\`sql
${BODY}
\`\`\`"
        else
          RISK=$(echo "$RESPONSE" | jq -r '.riskScore.label // "Unknown"')
          SCORE=$(echo "$RESPONSE" | jq -r '.riskScore.score // 0')
          BC=$(echo "$RESPONSE" | jq -r '(.summary.breakingChangeCount // (.breakingChanges | length) // 0)')
          BODY="## 🔍 SchemaLens Schema Diff

**Risk:** ${RISK} (${SCORE}/100) | **Breaking changes:** ${BC}

The full migration SQL is available in the [SchemaLens diff report](https://schemalens.tech/app.html). This check is free for every PR.

---
*Generated by [SchemaLens GitHub Action](https://schemalens.tech/github-action.html)*"
        fi

        # Append report link and CTAs to every PR comment
        if [ -n "$REPORT_URL" ]; then
          BODY="${BODY}

---

📄 **Download the full HTML report:** [SchemaLens diff report artifact](${REPORT_URL}) — includes risk score, breaking changes, migration SQL, and rollback SQL."
        fi

        BODY="${BODY}

---

🔔 **Schema drift alerts are free.** Add Slack/Teams notifications + shareable alert pages to every PR in one line. [Set up free alerts →](https://schemalens.tech/github-action.html#-schema-drift-alerts)

💡 **Want a shared workspace with 90-day persisted history?** [Upgrade to SchemaLens Team](https://schemalens.tech/team-buy.html)."

        PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
        COMMENT_STATUS=$(curl -s -o /tmp/schemalens_comment.json -w "%{http_code}" -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "${{ github.event.pull_request.comments_url }}" \
          -d "$PAYLOAD" || echo "000")

        if [ "$COMMENT_STATUS" != "201" ]; then
          echo "::warning::Failed to post PR comment (HTTP $COMMENT_STATUS). The diff was still computed and logged above."
          if [ -r /tmp/schemalens_comment.json ]; then
            cat /tmp/schemalens_comment.json || true
          fi
        else
          echo "PR comment posted successfully."
        fi

    - name: Create Check Run
      if: inputs.create-check-run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESPONSE_JSON: ${{ steps.diff.outputs.response }}
        REPORT_URL: ${{ steps.export-report.outputs.report-url }}
      run: |
        set -euo pipefail
        RESPONSE="$RESPONSE_JSON"

        # Extract fields from response
        RISK=$(echo "$RESPONSE" | jq -r '.riskScore.label // "Unknown"')
        SCORE=$(echo "$RESPONSE" | jq -r '.riskScore.score // 0')
        BC=$(echo "$RESPONSE" | jq -r '(.summary.breakingChangeCount // (.breakingChanges | length) // 0)')
        TA=$(echo "$RESPONSE" | jq -r '.summary.tablesAdded // 0')
        TR=$(echo "$RESPONSE" | jq -r '.summary.tablesRemoved // 0')
        TM=$(echo "$RESPONSE" | jq -r '.summary.tablesModified // 0')

        # Determine conclusion
        CONCLUSION="success"
        if [ "${{ inputs.fail-on-breaking }}" = "true" ] && [ "$BC" != "0" ]; then
          CONCLUSION="failure"
        fi

        # Build migration text
        if echo "$RESPONSE" | jq -e '.markdown' >/dev/null 2>&1; then
          MIGRATION_TEXT=$(echo "$RESPONSE" | jq -r '.markdown')
        elif echo "$RESPONSE" | jq -e '.migration' >/dev/null 2>&1; then
          MIGRATION_TEXT=$(echo "$RESPONSE" | jq -r '.migration')
        else
          MIGRATION_TEXT="The full migration SQL is generated by SchemaLens and is free for every PR. View it in the [SchemaLens app](https://schemalens.tech/app.html)."
        fi

        REPORT_NOTE=""
        if [ -n "$REPORT_URL" ]; then
          REPORT_NOTE="\n\n---\n\n📄 **Download the full HTML report:** [SchemaLens diff report artifact](${REPORT_URL}) — includes risk score, breaking changes, migration SQL, and rollback SQL."
        fi

        UPGRADE_NOTE="${REPORT_NOTE}\n\n---\n\n🔔 **Schema drift alerts are free.** Add Slack/Teams notifications + shareable alert pages to every PR in one line. [Set up free alerts →](https://schemalens.tech/github-action.html#-schema-drift-alerts)\n\n💡 **Want a shared workspace with 90-day persisted history?** [Upgrade to SchemaLens Team](https://schemalens.tech/team-buy.html)."

        # Build check run output
        TITLE="Risk: ${RISK} (${SCORE}/100) · Breaking: ${BC}"
        SUMMARY="SchemaLens detected **${TA}** added, **${TR}** removed, and **${TM}** modified tables. Risk level: **${RISK}** (${SCORE}/100). **${BC}** breaking change(s) found."

        TEXT="## Schema Diff Summary

| Metric | Value |
|--------|-------|
| Tables Added | ${TA} |
| Tables Removed | ${TR} |
| Tables Modified | ${TM} |
| Breaking Changes | ${BC} |
| Risk Score | ${SCORE}/100 (${RISK}) |

### Migration

\`\`\`sql
${MIGRATION_TEXT}
\`\`\`
${UPGRADE_NOTE}

---
*Generated by [SchemaLens GitHub Action](https://schemalens.tech/github-action.html)*"

        # Build payload with jq
        PAYLOAD=$(jq -n \
          --arg name "SchemaLens Schema Diff" \
          --arg sha "${{ github.sha }}" \
          --arg conclusion "$CONCLUSION" \
          --arg title "$TITLE" \
          --arg summary "$SUMMARY" \
          --arg text "$TEXT" \
          '{
            name: $name,
            head_sha: $sha,
            status: "completed",
            conclusion: $conclusion,
            output: {
              title: $title,
              summary: $summary,
              text: $text
            }
          }')

        CHECK_STATUS=$(curl -s -o /tmp/schemalens_check.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/check-runs" \
          -d "$PAYLOAD" || echo "000")

        if [ "$CHECK_STATUS" != "201" ]; then
          echo "::warning::Failed to create check run (HTTP $CHECK_STATUS). You may need to grant 'checks: write' permission to the workflow token. See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token"
          if [ -r /tmp/schemalens_check.json ]; then
            cat /tmp/schemalens_check.json || true
          fi
        else
          CHECK_ID=$(cat /tmp/schemalens_check.json | jq -r '.id // "unknown"')
          echo "Check run created successfully (ID: ${CHECK_ID})."
        fi

    - name: Send Schema Drift Alert
      if: inputs.schema-drift-webhook != ''
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.schema-drift-webhook }}
        LICENSE_KEY: ${{ inputs.license-key }}
        SLACK_URL: ${{ inputs.schema-drift-slack }}
        TEAMS_URL: ${{ inputs.schema-drift-teams }}
        RESPONSE_JSON: ${{ steps.diff.outputs.response }}
        OLD_PATH: ${{ inputs.old-schema-path }}
        NEW_PATH: ${{ inputs.new-schema-path }}
        DIALECT: ${{ inputs.dialect }}
      run: |
        set -euo pipefail
        RESPONSE="$RESPONSE_JSON"

        # Free tier works without a license key. Team tier provides persistent history and higher limits.
        if [ -z "$LICENSE_KEY" ]; then
          echo "Sending free-tier schema drift alert. Add a SchemaLens Team license key for persistent history and higher rate limits."
        else
          echo "Sending Team-tier schema drift alert."
        fi

        # Build notification object only if URLs provided
        NOTIFY_PARTS=()
        if [ -n "$SLACK_URL" ]; then
          NOTIFY_PARTS+=("\"slack\": \"$SLACK_URL\"")
        fi
        if [ -n "$TEAMS_URL" ]; then
          NOTIFY_PARTS+=("\"teams\": \"$TEAMS_URL\"")
        fi
        NOTIFY_JSON="{ $(printf '%s, ' "${NOTIFY_PARTS[@]}" | sed 's/, $//') }"
        if [ "${#NOTIFY_PARTS[@]}" -eq 0 ]; then
          NOTIFY_JSON="{}"
        fi

        # Read schemas safely with jq
        OLD_SCHEMA=$(jq -Rs . < "$OLD_PATH")
        NEW_SCHEMA=$(jq -Rs . < "$NEW_PATH")

        REPO="${{ github.repository }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT="${{ github.sha }}"
        COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
        PR_URL="${{ github.event.pull_request.html_url || '' }}"
        RUN_ID="${{ github.run_id }}"

        PAYLOAD_BASE=$(jq -n \
          --argjson oldSchema "$OLD_SCHEMA" \
          --argjson newSchema "$NEW_SCHEMA" \
          --arg dialect "$DIALECT" \
          --arg repo "$REPO" \
          --arg branch "$BRANCH" \
          --arg commit "$COMMIT" \
          --arg commitUrl "$COMMIT_URL" \
          --arg prUrl "$PR_URL" \
          --arg ciProvider "github-actions" \
          --arg runId "$RUN_ID" \
          --argjson notify "$NOTIFY_JSON" \
          '{
            oldSchema: $oldSchema,
            newSchema: $newSchema,
            dialect: $dialect,
            metadata: {
              repo: $repo,
              branch: $branch,
              commit: $commit,
              commitUrl: $commitUrl,
              prUrl: $prUrl,
              ciProvider: $ciProvider,
              runId: $runId
            },
            notify: $notify
          }')

        if [ -n "$LICENSE_KEY" ]; then
          PAYLOAD=$(echo "$PAYLOAD_BASE" | jq --arg token "$LICENSE_KEY" '. + { projectToken: $token }')
        else
          PAYLOAD="$PAYLOAD_BASE"
        fi

        HTTP_STATUS=$(curl -s -o /tmp/schemalens_drift.json -w "%{http_code}" -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" || echo "000")

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "::warning::Failed to send schema drift alert (HTTP $HTTP_STATUS)."
          if [ -r /tmp/schemalens_drift.json ]; then
            cat /tmp/schemalens_drift.json || true
          fi
        else
          ALERT_URL=$(cat /tmp/schemalens_drift.json | jq -r '.alertUrl // "unknown"')
          ALERT_ID=$(cat /tmp/schemalens_drift.json | jq -r '.alertId // "unknown"')
          TIER=$(cat /tmp/schemalens_drift.json | jq -r '.tier // "free"')
          echo "Schema drift alert sent (ID: ${ALERT_ID}, tier: ${TIER})."
          echo "Alert URL: ${ALERT_URL}"
          {
            echo ""
            echo "### 🔔 Schema Drift Alert (${TIER})"
            echo ""
            echo "- **Alert page:** ${ALERT_URL}"
            echo "- **Tier:** ${TIER}"
            if [ "$TIER" = "free" ]; then
              echo "- **Notifications:** Slack/Teams alerts are free. Upgrade to Team for 90-day persisted history."
            else
              echo "- **Notifications:** Slack/Teams alerts + persisted Team history."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
